# 로컬 개발용 인프라: DB·Redis·RabbitMQ만 띄우고, 백엔드·프론트는 IDE에서 직접 실행한다.
# 실행 (레포 루트에서): docker compose -f infra/docker-compose.local.yml --env-file .env up -d
# 종료: 같은 명령에서 up -d 대신 down  (데이터까지 지우려면 down -v)
# 기본값은 .env.example과 같다. .env 값을 바꿨다면 down -v 후 다시 띄워야 반영된다.
name: audisay-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audisay}
      POSTGRES_USER: ${POSTGRES_USER:-audisay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audisay}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-audisay}"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      # guest 계정은 컨테이너 밖(호스트)에서 접속할 수 없어서 별도 계정을 만든다
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-audisay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-audisay}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"     # 애플리케이션 접속
      - "127.0.0.1:15672:15672"   # 관리 화면 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  ai:
    build: ../ai                     # 경로는 이 파일(infra/) 기준
    profiles: ["ai"]
    env_file: ../.env
    environment:
      # .env의 localhost 값을 컨테이너 네트워크의 서비스 이름으로 덮어쓴다
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      H200_BASE_URL: http://host.docker.internal:8100   # 호스트 8100 포트 (H200 터널 등)
      WORKER_QUEUES: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
