server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: audisay

  # 로컬 실행·테스트 때 레포 루트 .env를 읽는다
  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:audisay}
    username: ${POSTGRES_USER:audisay}
    password: ${POSTGRES_PASSWORD:audisay}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC

  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    ignore-migration-patterns: "*:future,repeatable:missing"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:audisay}

  # @Scheduled 작업(outbox 재발행·SSE heartbeat·남은 시간·작업/업로드 정리)이 기본 스레드 1개를 나눠 쓰면
  # 하나가 오래 걸릴 때 heartbeat가 멈춰 프록시가 SSE를 끊는다
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: audisay-scheduling-

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:audisay}
    password: ${RABBITMQ_DEFAULT_PASS:audisay}
    # 발행 확인: 브로커 수신(ack/nack)과 라우팅 실패(return)를 CorrelationData로 받는다 (OutboxRelay)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

  # 서버를 거치는 파일은 작은 것만(시각장애인 인증 서류 10MB 등). 영상은 S3 presigned URL로 직접 올린다
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

audisay:
  chat:
    rate-limit:                       # 회원당 1분(고정 창) 챗봇 입력 제한. 넘으면 CHAT_009(429)
      requests-per-minute: 30         # 전체 입력(규칙으로 처리되는 재생 조작 포함)
      llm-calls-per-minute: 10        # LLM을 부른 횟수(발화 분류·장면 선택·후보 거르기)
    tuning:                           # 단계별 켜고 끄기(평가 285에서 하나씩 끄고 비교, 운영은 모두 true)
      intent-rules: true              # 발화 분류 규칙(끄면 모두 LLM)
      seek-keyword: true              # 장면 찾기 키워드 검색(끄면 모두 LLM)
      seek-negation-filter: true      # 부정 문장 빼기·요약하는 말 점수 낮추기
      seek-evidence-bonus: true       # 15초 안에 대사·해설·화면 글자가 함께 말하면 점수 올리기
      seek-llm-verify: true           # 대사 한 줄에서만 찾은 후보가 섞이면 LLM이 거르기
      seek-exact-only: true           # LLM이 정확히 맞는 장면만(비슷한 다른 일은 버림)
      seek-partial-verify: true       # 검색어 낱말을 다 못 맞힌 키워드 후보는 LLM이 확인한 뒤 이동
      answer-past-only: true          # 바로 하는 답은 질문한 시각까지 자료만(요약·지금 장면 설명 뺌)
      answer-future-check: true       # 바로 못 답하면 뒤쪽에 답이 있는지 확인해 "들으시겠어요?"
    answer:                           # 질문 답변 SSE(283)
      threads: 32                     # 동시에 만드는 답변 수(넘으면 CHAT_005)
      tts-threads: 16                 # 답변 문장 음성(AI /internal/tts) 스레드
      voice: F1                       # 답변 목소리(Supertonic, 안내 목소리와 같음)
      stream-timeout: 90s             # SSE 최대 연결 시간(LLM 전체 60초 + 음성)
      speech-wait: 15s                # LLM이 끝난 뒤 남은 문장 음성을 기다리는 최대 시간
      future-check-timeout: 60s       # 뒤 내용 확인 LLM 최대 시간(gms.timeouts.answer와 같게). SSE에 이만큼+speech-wait가 안 남으면 건너뜀
  job:
    partial-on-chunk-failure: true    # 조각 하나 실패 시 작업 전체 FAILED 대신 나머지로 PARTIAL
    stale:                            # 멈춘 작업 정리(5분마다). 마지막 활동 뒤 이 시간이 지나면 FAILED(AI_TIMEOUT)
      enabled: true
      queued-timeout: 2h              # 워커가 아직 안 받은 작업(대기열에서 기다리는 시간 포함)
      running-timeout: 45m            # 진행 중 작업(MERGE·TTS 등). 워커 메시지 제한 10분 × 3번 + 재시도 대기보다 길게.
                                      # 안 끝난 조각이 있거나 업로드(LOCAL) 영상 분석(PREPARE, 영상 길이의 약 1.4배)이면 queued-timeout

  ocr:                                # 인증 서류 글자 읽기(286). PaddleOCR PP-OCRv5 ONNX를 서버 안 CPU로, 서류는 밖으로 안 나감
    model-dir: ${OCR_MODEL_DIR:models/ocr}  # 실행 위치 기준. 로컬 backend/models/ocr(git 제외), 배포 이미지 /app/models/ocr
    det-model: det_mobile.onnx        # PP-OCRv5_mobile_det(공식 PaddlePaddle ONNX, 4.8MB)
    rec-model: rec.onnx               # korean_PP-OCRv5_mobile_rec(13MB)
    dictionary: dict.txt
    det-long-side: 960                # 긴 변을 이 크기로 바꿔 글자 위치를 찾음(모델 inference.yml resize_long)
    min-score: 0.6                    # 이 점수 미만인 줄은 버림(H200 /ocr와 같음)
    threads: 2                        # OCR 한 번에 쓰는 CPU 스레드
    max-concurrent: 1                 # 동시에 돌리는 OCR 수(한 장 1초 안팎, 인증은 드물어 1개로 최대 메모리를 줄임). 넘으면 wait-timeout까지 기다림
    wait-timeout: 10s
    optimization-level: ALL           # ALL → BASIC → NONE. 모델 로드·첫 추론이 실패하면 자동으로 낮춤

  verification:
    daily-attempts: 5                 # 회원당 하루(KST) 인증 서류 확인 횟수. 넘으면 USER_007(429)

  # 역할별 이용 제한 (기획서 2.3 초기값, GMS 크레딧 확인 후 조정). 관리자는 제한 없음
  usage-limits:
    general:
      youtube:
        max-duration-sec: 300
        daily-count: 2
      upload:
        max-duration-sec: 300
        daily-count: 1
        max-size: 500MB
    visually-impaired:
      youtube:
        max-duration-sec: 3600
        daily-count: 5
      upload:
        max-duration-sec: 3600
        daily-count: 3
        max-size: 2GB

  # YouTube Data API v3. 키는 사람마다 Google Cloud에서 발급해 .env에 둔다 (하루 10,000 유닛, 검색 1번 100 유닛)
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    base-url: https://www.googleapis.com/youtube/v3
    connect-timeout: 3s
    read-timeout: 5s

  # AI 서버 내부 API(/internal/*). 운영 주소(http://ai:8000)는 docker-compose.prod.yml에서 넣는다
  ai:
    base-url: ${AI_SERVER_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout: 2s
    stt-timeout: 12s  # AI: H200 4초 → 실패하면 GMS whisper 5초 + ffmpeg 변환·힌트 조회. FE axios 시간 제한(15초)이 업로드까지 포함이라 그보다 짧게
    tts-timeout: 7s   # 500자는 AI가 120자 조각 4~5개로 나눠 약 2초. H200이 느리면 조각마다 5초를 기다려 이 시간을 넘길 수 있지만
                      # 결과는 TTS_003과 같은 audioUrl null(브라우저 음성)이라 늘리지 않는다(늘리면 답변 문장 음성 대기만 길어짐)

  # 챗봇 LLM(분류·장면 찾기·답변). Spring이 GMS를 직접 부른다. 모델은 11-02 비교로 결정(claude_AudiSay_GMS_모델비교.md)
  # mode: real(기본) / mock(가짜 응답, 크레딧 0 — 로컬에서 아끼고 싶을 때 .env에 AUDISAY_GMS_MODE=mock)
  gms:
    mode: ${AUDISAY_GMS_MODE:real}
    api-key: ${GMS_API_KEY:}
    gemini-base-url: ${GMS_GEMINI_BASE_URL:https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
    anthropic-base-url: https://gms.ssafy.io/gmsapi/api.anthropic.com
    connect-timeout: 2s
    thinking-budget: 0
    thinking-levels:                # 추론을 끌 수 없는 모델(thinkingBudget 0이면 400)은 가장 적은 추론 단계로
      "[gemini-3.5-flash-lite]": minimal
    models:
      intent: gemini-3.1-flash-lite
      seek: gemini-3.1-flash-lite
      answer: gemini-3.1-flash-lite
    timeouts:
      intent: 5s
      seek: 10s
      answer: 60s
    stream-first-event-timeout: 10s
    # Gemini가 429·장애·서킷 열림이면 한 번 더 부를 대체 모델(다른 공급사라 한도가 따로). 시간 초과·안전 거부는 대체 안 함
    fallback:
      enabled: true
      models:
        intent: claude-haiku-5-5
        seek: claude-haiku-5-5
        answer: claude-haiku-5-5
    # 토큰당 크레딧(입력/출력, 출력에 추론 토큰 포함). GMS common-codes/models 2026-11-03, trace의 creditUsed와 일치 확인
    # 표에 없는 모델(h200:*, supertonic, mock)은 0. whisper-1은 토큰이 아니라 녹음 1초 = 1크레딧이라 표에 넣지 않음
    prices:
      "[gemini-3.1-flash-lite]": { input: 0.0025, output: 0.015 }
      "[gemini-3.5-flash-lite]": { input: 0.003, output: 0.025 }
      "[gemini-3.5-flash]": { input: 0.015, output: 0.09 }
      "[gemini-3.8-flash]": { input: 0.015, output: 0.075 }
      "[gemini-3.8-flash-tts]": { input: 0.01, output: 0.18 }
      "[gemini-3.8-flash-lite-tts]": { input: 0.01, output: 0.12 }
      "[claude-haiku-5-5]": { input: 0.001, output: 0.005 }
      "[text-embedding-3-large]": { input: 0.0013, output: 0 }
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-in-open-state: 30s
      permitted-calls-in-half-open: 3
    mock:
      latency: 300ms
      # failure: rate-limit   # 주 모델에 일부러 낼 실패(rate-limit / unavailable / timeout). 대체 모델 동작 확인용

  # 장면 검색 임베딩(342). GMS OpenAI 형식, 키·서킷·단가는 audisay.gms. dimensions는 V7 vector(1536)과 같아야 함
  embedding:
    base-url: https://gms.ssafy.io/gmsapi/api.openai.com
    model: text-embedding-3-large
    dimensions: 1536
    batch-size: 100
    query-timeout: 3s
    document-timeout: 30s

  scene-search:                       # 장면 검색 RAG(342)
    index:                            # 공개 직후 바로 색인 + 5분마다 놓친 것·실패·관리자 수정·보관 정리
      enabled: true
      batch-size: 5                   # 스케줄러 한 번에 색인하는 해설 수(배포 전 공개분도 이 속도로 채움)
      retry-after: 30m                # FAILED 다시 시도
      stuck-after: 10m                # PENDING이 이보다 오래면 멈춘 것으로 보고 다시 맡음
      archived-retention: 7d          # 재생성으로 보관된 해설의 색인을 새 해설이 생긴 뒤 이만큼 지나면 삭제
    search:
      mode: FALLBACK                  # OFF(지금 방식) / FALLBACK(키워드가 확실하면 그대로, 애매하거나 못 찾으면 RAG) / ALWAYS(늘 RAG)
      candidates: 5                   # 키워드·벡터 후보를 RRF로 합친 뒤 LLM이 확인할 개수
      vector-top-k: 20                # 벡터 검색으로 가져올 줄 수
    answer:                           # 질문 답변 RAG: 지금 자료(앞·지금 장면)보다 앞의 비슷한 줄, 뒤 확인은 비슷한 뒤 줄 + 요약
      mode: ${AUDISAY_SCENE_SEARCH_ANSWER_MODE:FALLBACK}  # OFF / FALLBACK(지금 자료로 먼저, "자료에 없어요"면 앞 줄 더해 다시) / ALWAYS
      earlier-top-k: 8                # 앞에서 가져올 줄 수
      later-top-k: 12                 # 뒤 확인에 쓸 줄 수

  # S3. 버킷이 비어 있으면 음성 주소(audioUrl)를 만들지 않는다 → FE가 브라우저 음성으로 읽음
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    audio-url-expiration: 6h
    upload-part-size: 10MB
    upload-part-url-expiration: 30m
    playback-url-expiration: 1h

jwt:
  # 기본값 없음: 로컬은 .env의 공용 값, 서버는 Jenkins audisay-env의 별도 값 (32바이트 이상)
  secret: ${JWT_SECRET}
  # 30m, 1h, 14d 같은 단위 표기나 밀리초 숫자(1800000)를 넣을 수 있다
  access-token-expiration: ${JWT_ACCESS_EXP:1h}
  refresh-token-expiration: ${JWT_REFRESH_EXP:14d}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}   # Grafana JVM 대시보드에서 앱 구분용
    distribution:
      percentiles-histogram:
        http.server.requests: true              # API p95 응답 시간 계산용
          