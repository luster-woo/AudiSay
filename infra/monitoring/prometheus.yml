global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]

  # 서버 자원 (CPU·메모리·디스크)
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]

  # 컨테이너별 자원
  - job_name: cadvisor
    static_configs: [{ targets: ['cadvisor:8080'] }]

  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]

  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]

  # RabbitMQ 전체 지표 (노드, 연결 수)
  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  # RabbitMQ 큐별 메시지 수 (job.prepare, job.describe, job.dlq)
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  # Spring Boot (-116에서 백엔드 연동 후 UP)
  - job_name: backend
    metrics_path: /api/actuator/prometheus
    static_configs: [{ targets: ['backend:8080'] }]

  # AI 서버 (이미 /metrics 노출 중)
  - job_name: ai
    metrics_path: /metrics
    static_configs: [{ targets: ['ai:8000'] }]
