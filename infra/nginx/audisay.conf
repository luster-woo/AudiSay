server {
    listen 80;
    server_name k15d101.p.ssafy.io;

    # React (frontend 컨테이너)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        # 컨테이너 nginx 는 HTTP/1.1 요청만 gzip 한다(gzip_http_version 기본값 1.1).
        # proxy 기본값(1.0)으로 넘기면 JS·CSS 가 압축되지 않은 채 나간다
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # actuator는 외부 차단 (Jenkins가 Docker 내부망으로만 확인)
    location /api/actuator/ {
        return 404;
    }

    # Spring Boot (backend 컨테이너)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE·스트리밍 응답이 끝날 때 몰려오는 문제 방지
        proxy_read_timeout 3600s;
        client_max_body_size 20m;
    }

    # Grafana (로그인 필요). serve_from_sub_path 사용이라 proxy_pass 끝에 / 를 붙이지 않는다
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Jenkins
    location = /jenkins {
        return 301 /jenkins/;
    }
    location /jenkins/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 50m;
    }
}
