<!doctype html>
<html lang="ko" data-font-scale="3" data-contrast="normal">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Audisay - 시각장애인을 위한 화면해설 플레이어" />
    <title>AudiSay</title>
    <!-- 새로고침 때 랜딩(남색)이 그려지기 전 밝은 기본 바탕이 번쩍이지 않게, CSS·JS보다 먼저 바탕을 칠한다. LandingPage 가 떠날 때 표시를 지운다 -->
    <style>
      html[data-page='landing'],
      html[data-page='landing'] body {
        background-color: #172a46;
      }
    </style>
    <script>
      if (location.pathname === '/landing') document.documentElement.dataset.page = 'landing'
      // 글자 크기·고대비를 그리기 전에 칠한다. 설정 응답(로그인 확인 뒤)을 기다리면 기본 크기로 그린 화면이
      // 한 번 더 커지며 밀린다. 키는 src/features/settings/displayCache.ts 의 DISPLAY_KEY. 관리자 화면은 고정 크기라 건너뛴다
      try {
        var d = JSON.parse(localStorage.getItem('audisay:display') || 'null')
        if (d && !location.pathname.startsWith('/admin')) {
          if ([1, 2, 3, 4, 5].indexOf(d.fontSizeLevel) >= 0) document.documentElement.dataset.fontScale = String(d.fontSizeLevel)
          document.documentElement.dataset.contrast = d.highContrast === true ? 'high' : 'normal'
        }
      } catch (e) {
        /* 저장소를 막은 브라우저·깨진 값: 기본값(3단계·일반 대비)으로 그린다 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
